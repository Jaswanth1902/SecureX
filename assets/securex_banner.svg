<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-sec" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141916" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0B0E0D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060807" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#060807"/>
  <rect width="1200" height="420" fill="url(#vignette-sec)"/>

  <!-- Architectural Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Mechanical Cryptographic Lock & Cipher Dials (Left Visual) -->
  <g transform="translate(225, 210)" stroke="#C5A059" fill="none">
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="165"/>
      <circle cx="0" cy="0" r="125"/>
      <circle cx="0" cy="0" r="85"/>
      <circle cx="0" cy="0" r="45"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
    </g>

    <!-- Cryptographic Shield Outline (Renaissance Geometry) -->
    <path d="M0,-115 C70,-115 110,-85 110,0 C110,75 50,115 0,140 C-50,115 -110,75 -110,0 C-110,-85 -70,-115 0,-115 Z" 
          stroke="url(#gold-sec)" stroke-width="1.2" fill="#0D1210" fill-opacity="0.8"/>

    <!-- Inner Key Cylinder & Tumblers -->
    <circle cx="0" cy="0" r="35" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="15" stroke="#10B981" stroke-width="1" fill="#0B1511"/>
    <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#E5C77A" stroke="none"/>

    <!-- Dial Degree Ticks -->
    <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
      <line x1="0" y1="-65" x2="0" y2="-55"/>
      <line x1="0" y1="65" x2="0" y2="55"/>
      <line x1="-65" y1="0" x2="-55" y2="0"/>
      <line x1="65" y1="0" x2="55" y2="0"/>
    </g>

    <!-- Annotations -->
    <text x="-165" y="-140" fill="#C5A059" opacity="0.45" font-size="9" class="mono-tech">FIG. V — CRYPTOGRAPHIC VAULT</text>
    <text x="-165" y="145" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">AES-256-GCM • ZERO-KNOWLEDGE</text>
    <text x="-165" y="160" fill="#10B981" opacity="0.5" font-size="8" class="mono-tech">PBKDF2 / ARGON2id KEY DERIVATION</text>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(465, 0)">
    <text x="0" y="125" fill="#C5A059" font-size="11" letter-spacing="4" class="serif-title" opacity="0.85">
      ZERO-LEAKAGE CRYPTOGRAPHIC VAULT &amp; CIPHER ENGINE
    </text>

    <text x="0" y="185" fill="#FDFBF7" font-size="52" letter-spacing="12" class="serif-title">
      S E C U R E X
    </text>

    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <text x="0" y="245" fill="#C5BEB3" font-size="14" letter-spacing="2" class="serif-title" opacity="0.9">
      AES-256-GCM • LOCAL CIPHER STORAGE • BIOMETRIC UNLOCK
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      End-to-end encrypted personal data vault with memory zeroization and zero cloud telemetry.
    </text>

    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#101512" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">AES-256-GCM</text>

      <rect x="142" y="0" width="135" height="24" rx="2" fill="#101512" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="209" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">ZERO TELEMETRY</text>

      <rect x="289" y="0" width="145" height="24" rx="2" fill="#101512" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="16" fill="#10B981" font-size="10" text-anchor="middle" class="mono-tech">MEMORY ZEROIZE</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX SILENTIO VIRTUS • ANNO MMXXVI • OPEN SOURCE SECURITY
    </text>
  </g>
</svg>